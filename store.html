<!doctype html><meta charset="utf-8"><title>Deadlock UI mod store</title><script>
// Store page of the Deadlock "dolboeb detector" UI mod, opened by the game in a hidden HTML panel. Panorama cannot
// keep anything between game launches, the browser storage of this page can: it holds the mod's data (one JSON
// value) on the player's own PC. Nothing leaves the PC; the page makes no requests.
//   store.html#op=get&p=<title prefix>&q=<request id>&have=<version the game holds>
//   store.html#op=put&p=..&q=..&ops=<JSON list of changes>
// The page stays loaded between jobs: the game only changes the part after "#".
// Answers go back through document.title, one short message at a time: <prefix>{ q, s, f, d }.
var KEY = "ddb_db", PREV_KEY = "ddb_db_prev";
var MAX_MESSAGE = 1500;
var SPACING_MS = 250;   // time between two titles, so the game sees every one of them
var queue = [], busy = false, seq = 0, current = null;

// The mod's data and the changes made to it. The same code runs in the game (DDB) and in the store page
// (store.html, which keeps the data in the browser storage); build.py / publish_store.py paste it into both.
//   marks: account -> { n: name, h: hero, t: time marked }   (the list of marked players)
//   on:    the mod is switched on; toast: the alert at match start is switched on
//   ver:   bumped by the store page on every save
function ddbEmpty() {
	return { ver: 0, on: true, toast: true, marks: {} };
}

// one change: ["mark", acc, entry] / ["unmark", acc] / ["on", true|false] / ["toast", true|false]
function ddbApply(db, op) {
	if (op[0] === "mark") db.marks[op[1]] = op[2];
	else if (op[0] === "unmark") delete db.marks[op[1]];
	else if (op[0] === "on") db.on = !!op[1];
	else if (op[0] === "toast") db.toast = !!op[1];
	return db;
}

// data read from storage: only what the mod keeps (older versions kept more)
function ddbClean(db) {
	var e = ddbEmpty();
	if (!db || typeof db !== "object") return e;
	if (typeof db.ver === "number") e.ver = db.ver;
	if (db.on === false || (db.cfg && db.cfg.on === false)) e.on = false;
	if (db.toast === false) e.toast = false;
	if (db.marks && typeof db.marks === "object") {
		for (var acc in db.marks) {
			var m = db.marks[acc];
			if (!/^\d+$/.test(acc) || !m || typeof m !== "object") continue;
			e.marks[acc] = { n: String(m.n || ""), h: String(m.h || ""), t: Number(m.t) || 0 };
		}
	}
	return e;
}


function next() {
	var item = queue.shift();
	if (!item) { busy = false; return; }
	busy = true;
	seq++;
	document.title = item.job.prefix + JSON.stringify({ q: item.job.req, s: seq, f: item.fin ? 1 : 0, d: item.data });
	setTimeout(next, SPACING_MS);
}

function Job(params) {
	this.P = params;
	this.prefix = params.get("p") || "";
	this.req = Number(params.get("q"));
}

Job.prototype.send = function (data, fin) {
	if (current !== this) return;
	queue.push({ job: this, data: data, fin: fin });
	if (!busy) next();
};

function load() {
	try { return ddbClean(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) { return ddbEmpty(); }
}

function save(db) {
	var old = localStorage.getItem(KEY);
	if (old) localStorage.setItem(PREV_KEY, old);
	localStorage.setItem(KEY, JSON.stringify(db));
}

var jobs = {
	// the whole data in pieces (k: "c", i of n), or "same" when the game already holds this version
	get: function (job) {
		var db = load();
		if (String(db.ver) === job.P.get("have")) return job.send({ k: "same", ver: db.ver }, 1);
		var text = JSON.stringify(db), n = Math.max(1, Math.ceil(text.length / MAX_MESSAGE));
		for (var i = 0; i < n; i++) job.send({ k: "c", i: i, n: n, t: text.substr(i * MAX_MESSAGE, MAX_MESSAGE) }, i === n - 1 ? 1 : 0);
	},
	put: function (job) {
		var ops;
		try { ops = JSON.parse(job.P.get("ops") || "[]"); } catch (e) { return job.send({ k: "e", e: "bad ops" }, 1); }
		var db = load(), before = db.ver;
		ops.forEach(function (op) { ddbApply(db, op); });
		db.ver = before + 1;
		try { save(db); } catch (e) { return job.send({ k: "e", e: "storage: " + e }, 1); }
		job.send({ k: "ok", ver: db.ver, was: before }, 1);
	}
};

function start() {
	var job = new Job(new URLSearchParams(location.hash.slice(1) || location.search.slice(1)));
	if (current && current.req === job.req && current.prefix === job.prefix) return;
	current = job;
	queue = queue.filter(function (item) { return item.job === job; });
	(jobs[job.P.get("op")] || function () { job.send({ k: "e", e: "unknown op" }, 1); })(job);
}

window.addEventListener("hashchange", start);
start();
</script>
